# minio-pvc.yaml
# ─────────────────────────────────────────────────────────────
# Demande de stockage persistant pour MinIO.
# Équivalent du volume nommé "anfa-minio-data" en Docker Compose.

apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: minio-pvc           # nom de la ressource (referencee par le déploiement)
spec:
  # accesModes: qui peut monter ce volume
  # ReadWriteOnce : un seul noeud a la fois en lecture/ecriture (suffisant ici)
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 2Gi          # demande de stockage (2 Go)